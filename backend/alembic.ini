# Alembic configuration for the aniGamerPlus backend.
#
# ``sqlalchemy.url`` is overridden programmatically by
# ``app.persistence.db.Database.run_baseline_migrations`` so the Python
# side can always point Alembic at the ``aniGamer.db`` it picked via
# ``WorkspacePaths``. The value below is only used when someone runs
# ``alembic upgrade head`` by hand.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///${ANIGAMERPLUS_DB_PATH:-./aniGamer.db}
# Keep default file template & timezone; we never generate revisions with
# ``alembic revision --autogenerate`` in CI, so the Mako defaults are fine.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
