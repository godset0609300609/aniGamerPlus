[project]
name = "anigamerplus-backend"
version = "0.1.0"
description = "aniGamerPlus FastAPI backend (動畫瘋下載器)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "requests>=2.32",
    "chardet>=5.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pysocks>=1.7",
    "pyhttpx",
    "termcolor>=2.5",
    "pip-system-certs>=4.0",
    "colorama>=0.4",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "typer>=0.15",
]

[project.scripts]
anigamerplus = "app.cli:app"
anigamerplus-api = "app.main:serve"
anigamerplus-server = "app.main:serve"
anigamerplus-scheduler = "app.scheduler_server:serve"
anigamerplus-admin = "app.admin_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/downloader/assets/danmu_template.ass" = "app/downloader/assets/danmu_template.ass"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "anyio[trio]>=4.0",
    "mypy>=1.20.1",
    "types-requests>=2.33.0.20260408",
    "pytest-cov>=6.0",
    "coverage[toml]>=7.0",
    "ruff>=0.15.11",
    "mutmut>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --cov=app --cov-report=term-missing --cov-report=html --cov-report=xml"
filterwarnings = ["error", "ignore::coverage.exceptions.CoverageWarning"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py", "app/admin_cli.py", "*/tests/*", "*/__init__.py", "*/alembic/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if T.TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/", "^alembic/"]

[tool.mutmut]
paths_to_mutate = ["app/"]
# tests_dir is omitted so that pytest_add_cli_args_test_selection controls the test scope.
# Full-repo run: remove pytest_add_cli_args_test_selection or override on CLI.
pytest_add_cli_args = ["--no-cov", "--override-ini=addopts="]
pytest_add_cli_args_test_selection = ["tests/test_cd_counter.py"]
also_copy = ["alembic/", "alembic.ini", "config.json", "cookie.txt", "README.md"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "single"
