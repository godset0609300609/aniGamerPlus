# E2E workflow scaffold — not yet enabled on push/PR.
# Remove the `if: false` gate and configure secrets to activate.
name: E2E Tests

on:
  # Disabled until backend startup in CI is validated.
  # Enable by removing the `if: false` step-level guard or by adding
  # a push/pull_request trigger here.
  workflow_dispatch:

jobs:
  e2e:
    if: false  # scaffold only — remove to enable
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: pipx install uv

      - name: Install backend dependencies
        run: uv sync --project backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run E2E tests
        run: npm run e2e
        working-directory: frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
